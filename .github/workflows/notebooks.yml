name: notebooks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the model, helpers and test tools
        timeout-minutes: 15
        run: pip install ".[dev]"

      - name: Cache the TUV-x photolysis data
        uses: actions/cache@v4
        with:
          path: ~/.cache/aaar_tutorial
          key: tuvx-${{ hashFiles('aaar_tutorial/config.py') }}

      - name: Unit tests
        timeout-minutes: 10
        run: pytest

      # Every notebook top to bottom in a fresh kernel; tests/test_notebooks.py limits each
      # cell to 15 min and each notebook to 30 min (config.NOTEBOOK_*_TIMEOUT_S).
      - name: Execute the notebooks
        timeout-minutes: 40
        run: pytest -m notebooks -v --durations=0
